140Q138 132 146 132H814Q822 132 822 140V155M366 132V155M594 132V155" fill="none" stroke="#5A626C" stroke-width="1.4" stroke-linecap="round"/><rect x="42" y="156" width="192" height="146" rx="16" fill="#0d1a24" stroke="#0c374f"/><rect x="60" y="174" width="34" height="34" rx="10" fill="url(#g-scout)"/><g transform="translate(68 182) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15.3 8.7l-2 4.6-4.6 2 2-4.6z"/></g><g transform="translate(202 176) scale(0.5832999999999999)" fill="none" stroke="#6E7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></g><text x="60" y="236" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F0F6FC" letter-spacing="-0.1">Scout</text><text x="60" y="260" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9198A1">Maps your app and</text><text x="60" y="280" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9198A1">writes the checklist</text><rect x="270" y="156" width="192" height="146" rx="16" fill="#161627" stroke="#33285a"/><rect x="288" y="174" width="34" height="34" rx="10" fill="url(#g-tester)"/><g transform="translate(296 182) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 4v13.6l3.6-3.3 2.5 5.6 2.4-1-2.5-5.6h5z"/></g><g transform="translate(430 176) scale(0.5832999999999999)" fill="none" stroke="#6E7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></g><text x="288" y="236" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F0F6FC" letter-spacing="-0.1">Testers</text><text x="288" y="260" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9198A1">Use it like real</text><text x="288" y="280" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#9198A1">people, with evidence</text><rect x="498" y="156" width="192" height="146" rx="16" fill="#0d1b1d" stroke="#0c3b31"/><rect x="516" y="174" width="34" height="34" rx="10" fill="url(#g-verifier)"/><g transform="translate(524 182) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.5 15.5l4.5 4.5M8.3 10.9l1.8 1.8 3.2-3.4"/></g><g transform="translate(658 176) scale(0.5832999999999999)" fill="none" stroke="#6E7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></g><text x="516" y="236" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="600" fill="#F0F6FC" letter-spacing="-0.1">Verifier</text><text x="516" y="260" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill