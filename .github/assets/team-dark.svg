<svg xmlns="http://www.w3.org/2000/svg" width="960" height="368" viewBox="0 0 960 368" role="img" aria-labelledby="title desc">
<title id="title">How the enhance-qa team works</title>
<desc id="desc">You, the product owner, say go and get a report from the lead, who runs each pass and writes the qa/ record in your repo. The lead briefs four roles. The scout maps your app and writes the checklist. Three testers use it like real people, with evidence. The verifier reproduces every bug and re-checks every fix. The fixer makes one commit per bug, with a failing test first. Work flows from scout to testers to verifier to fixer, and every fix goes back to the verifier. The scout, testers and verifier are read-only.</desc>
<defs><linearGradient id="g-scout" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ba0d7"/><stop offset="1" stop-color="#0891D1"/></linearGradient><linearGradient id="g-tester" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b73f7"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="g-verifier" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2cac82"/><stop offset="1" stop-color="#0A9E6E"/></linearGradient><linearGradient id="g-fixer" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ed6f2e"/><stop offset="1" stop-color="#EA580C"/></linearGradient><linearGradient id="g-lead" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eb62a8"/><stop offset="1" stop-color="#E8489A"/></linearGradient></defs>
