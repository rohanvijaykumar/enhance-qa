" stroke="#5A626C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M719 236H697" stroke="#5A626C" stroke-width="1.4" stroke-linecap="round"/><path d="M702 232L697 236L702 240" fill="none" stroke="#5A626C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(42 325) scale(0.625)" fill="none" stroke="#6E7681" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></g><text x="63" y="337" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198A1">Read-only: can’t change your code</text><text x="918" y="337" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9198A1" text-anchor="end">Every fix is re-checked by the verifier</text>
